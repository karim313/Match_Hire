<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Outer glowing ring / matching circle -->
  <circle cx="256" cy="256" r="200" stroke="url(#logo-grad)" stroke-width="12" fill="none" opacity="0.15" />
  <circle cx="256" cy="256" r="200" stroke="url(#logo-grad)" stroke-width="12" stroke-dasharray="40 20" fill="none" opacity="0.6" />

  <!-- Logo Shape: Stylized M and Checkmark -->
  <g filter="url(#glow)">
    <!-- The letter M path -->
    <path d="M140 360 V200 L210 270 L280 200 L350 270 L350 310" 
          stroke="url(#logo-grad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
    <!-- The Checkmark / Match path that crosses or completes it -->
    <path d="M300 340 L350 390 L440 260" 
          stroke="#10b981" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
  </g>
</svg>
